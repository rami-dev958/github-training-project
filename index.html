<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | رامي أبو شاويش</title>
    <!-- ربط ملف التنسيق -->
    <link rel="stylesheet" href="css/style.css">
    <!-- استدعاء خط عربي جميل من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الجزء الأول: شريط التنقل (Navbar) -->
    <header>
        <nav class="navbar">
            <div class="logo">ملفي الشخصي</div>
            <ul class="nav-links">
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">عنّي</a></li>
                <li><a href="#">تواصل معي</a></li>
            </ul>
        </nav>
    </header>

    <!-- الجزء الثاني: المحتوى الرئيسي (قسم المعلومات الشخصية) -->
    <main class="container">
        <div class="profile-card">
            <div class="profile-image">
                <!-- يمكنك استبدال الرابط بصورتك الشخصية لاحقاً -->
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="صورة شخصية">
            </div>
            <div class="profile-info">
                <h1>رامي محمد أنور أبو شاويش</h1>
                <p class="role">طالب تطوير وبرمجة صفحات الويب</p>
                
                <div class="details">
                    <p><strong>الرقم الجامعي:</strong> 120210835</p>
                    <p><strong>التخصص:</strong> دبلوم تطوير وبرمجة صفحات الويب</p>
                    <p><strong>الجامعة:</strong> الكلية الجامعية للعلوم التطبيقية</p>
                </div>
            </div>
        </div>
    </main>

    <!-- الجزء الثالث: التذييل (Footer) -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 | تم التطوير بواسطة رامي أبو شاويش</p>
    </footer>

</body>
</html>
